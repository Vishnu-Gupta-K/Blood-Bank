<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <style>
    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; filter: drop-shadow(0 0 3px rgba(231, 76, 60, 0.3)); }
      50% { transform: scale(1.05); opacity: 0.9; filter: drop-shadow(0 0 10px rgba(231, 76, 60, 0.6)); }
      100% { transform: scale(1); opacity: 1; filter: drop-shadow(0 0 3px rgba(231, 76, 60, 0.3)); }
    }
    
    @keyframes drip {
      0% { transform: translateY(0) scale(0.8); opacity: 0; }
      20% { opacity: 1; transform: translateY(20px) scale(1); }
      80% { opacity: 1; }
      100% { transform: translateY(90px) scale(0.9); opacity: 0; }
    }
    
    @keyframes rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    @keyframes counterRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }
    
    @keyframes flow {
      0% { opacity: 0.2; }
      50% { opacity: 0.5; }
      100% { opacity: 0.2; }
    }
    
    @keyframes dash {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    
    @keyframes fadeInOut {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.8; }
    }
    
    .blood-drop {
      animation: pulse 3s infinite cubic-bezier(0.455, 0.03, 0.515, 0.955);
      transform-origin: center;
      filter: drop-shadow(0 0 5px rgba(231, 76, 60, 0.4));
    }
    
    .drip-1 {
      animation: drip 2.5s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
      animation-delay: 0s;
    }
    
    .drip-2 {
      animation: drip 2.5s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
      animation-delay: 0.8s;
    }
    
    .drip-3 {
      animation: drip 2.5s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
      animation-delay: 1.6s;
    }
    
    .spinner {
      animation: rotate 8s infinite cubic-bezier(0.785, 0.135, 0.15, 0.86);
      transform-origin: center;
    }
    
    .counter-spinner {
      animation: counterRotate 12s infinite linear;
      transform-origin: center;
    }
    
    .flow-effect {
      animation: flow 3s infinite ease-in-out alternate;
    }
    
    .dash-line {
      stroke-dasharray: 600;
      stroke-dashoffset: 600;
      animation: dash 4s cubic-bezier(0.445, 0.05, 0.55, 0.95) infinite alternate;
    }
    
    .pulse-ring {
      animation: fadeInOut 3s infinite ease-in-out;
    }
  </style>
  
  <!-- Definitions for gradients and filters -->
  <defs>
    <linearGradient id="dropGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c0392b" />
    </linearGradient>
    
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f9fa" />
      <stop offset="100%" stop-color="#f0f0f0" />
    </linearGradient>
    
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="0" dy="2" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background with subtle gradient -->
  <rect width="200" height="200" fill="url(#bgGradient)" rx="10" ry="10" />
  
  <!-- Circular Background with enhanced animation -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#e74c3c" stroke-width="4" stroke-dasharray="10 5" class="spinner" opacity="0.8" />
  
  <!-- Secondary spinner (counter-rotating) -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#e74c3c" stroke-width="1" stroke-dasharray="5 10" class="counter-spinner" opacity="0.5" />
  
  <!-- Pulse Rings -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="#e74c3c" stroke-width="0.5" class="pulse-ring" />
  <circle cx="100" cy="100" r="60" fill="none" stroke="#e74c3c" stroke-width="0.5" class="pulse-ring" style="animation-delay: 1s;" />
  
  <!-- Blood Drop with enhanced gradient and filter -->
  <path d="M100 30 C90 80 70 100 70 130 C70 155 85 180 100 180 C115 180 130 155 130 130 C130 100 110 80 100 30 Z" 
        fill="url(#dropGradient)" class="blood-drop" filter="url(#dropShadow)" />
  
  <!-- Inner Highlight with Animation -->
  <path class="flow-effect" d="M85 130 C85 110 90 90 95 70 C90 90 85 110 85 130 C85 145 90 160 100 170 C90 160 85 145 85 130 Z" 
        fill="#fff" opacity="0.3" />
  
  <!-- Enhanced Drips with gradient and better shape -->
  <path d="M95 180 L95 190 C95 195 90 200 85 200 C80 200 75 195 75 190 L75 185 Z" fill="url(#dropGradient)" class="drip-1" filter="url(#dropShadow)" />
  <path d="M105 180 L105 190 C105 195 110 200 115 200 C120 200 125 195 125 190 L125 185 Z" fill="url(#dropGradient)" class="drip-2" filter="url(#dropShadow)" />
  <path d="M100 180 L100 190 C100 195 100 200 100 200 C100 200 100 195 100 190 L100 185 Z" fill="url(#dropGradient)" class="drip-3" filter="url(#dropShadow)" />
  
  <!-- Animated Path Lines -->
  <path class="dash-line" d="M30 100 C50 80 80 120 100 100 C120 80 150 120 170 100" 
        fill="none" stroke="#e74c3c" stroke-width="1" stroke-linecap="round" opacity="0.5" />
  
  <!-- Loading Text -->
  <text x="100" y="20" font-family="'Segoe UI', sans-serif" font-size="10" fill="#666" text-anchor="middle" class="pulse-ring">
    LOADING
  </text>
</svg>