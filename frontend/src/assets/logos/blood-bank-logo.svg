<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 160" width="200" height="60">
  <style>
    @keyframes pulse {
      0% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(231, 76, 60, 0.3)); }
      50% { transform: scale(1.05); filter: drop-shadow(0 0 8px rgba(231, 76, 60, 0.5)); }
      100% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(231, 76, 60, 0.3)); }
    }
    
    @keyframes flow {
      0% { opacity: 0.2; }
      50% { opacity: 0.5; }
      100% { opacity: 0.2; }
    }
    
    @keyframes dash {
      to { stroke-dashoffset: 0; }
    }
    
    .blood-drop {
      animation: pulse 3s infinite ease-in-out;
      transform-origin: center;
    }
    
    .flow-effect {
      animation: flow 3s infinite ease-in-out alternate;
    }
    
    .text-animate {
      stroke-dasharray: 500;
      stroke-dashoffset: 500;
      animation: dash 3s ease-in-out forwards;
    }
  </style>
  
  <!-- Modern Blood Drop Icon with Gradient -->
  <g transform="translate(10, 10) scale(0.3)" class="blood-drop">
    <!-- Main Drop Shape with Gradient -->
    <defs>
      <linearGradient id="dropGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#e74c3c" />
        <stop offset="100%" stop-color="#c0392b" />
      </linearGradient>
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
    </defs>
    
    <!-- Main Drop with Rounded Bottom -->
    <path d="M256 0C230 150 160 250 160 350C160 440 200 512 256 512C312 512 352 440 352 350C352 250 282 150 256 0Z" 
          fill="url(#dropGradient)" />
    
    <!-- Inner Highlight -->
    <path class="flow-effect" d="M200 350C200 300 220 250 240 200C220 250 200 300 200 350C200 400 220 450 256 475C220 450 200 400 200 350Z" 
          fill="#ffffff" opacity="0.3" />
    
    <!-- Shine Effect -->
    <path d="M190 350C190 270 220 200 245 120C235 200 210 270 210 350C210 410 235 460 256 480C225 460 190 410 190 350Z" 
          fill="#ffffff" opacity="0.2" />
  </g>
  
  <!-- Modern Text with Path Animation -->
  <defs>
    <filter id="textShadow" x="-2" y="-2" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.3)" />
    </filter>
  </defs>
  
  <!-- Blood Text -->
  <path class="text-animate" d="M170 85 h10 q10 0 10 -10 v-10 q0 -10 -10 -10 h-20 v60 h20 q10 0 10 -10 v-10 q0 -10 -10 -10 h-10 M220 55 h20 q10 0 10 10 v30 q0 10 -10 10 h-20 q-10 0 -10 -10 v-30 q0 -10 10 -10 M270 55 v40 q0 10 10 10 h10 q10 0 10 -10 v-40 h-10 v40 h-10 v-40 h-10 M320 55 v40 q0 10 10 10 h10 q10 0 10 -10 v-40 h-10 v40 h-10 v-40 h-10" 
        fill="none" stroke="#e74c3c" stroke-width="3" filter="url(#textShadow)" />
  
  <!-- Bank Text -->
  <path class="text-animate" d="M370 55 h20 q10 0 10 10 v5 q0 5 -5 7 q5 2 5 7 v5 q0 10 -10 10 h-20 v-44 M370 65 v10 h10 v-10 h-10 M370 85 v10 h10 v-10 h-10 M410 55 h10 v30 l15 -30 h10 v44 h-10 v-30 l-15 30 h-10 v-44 M455 55 v44 h10 v-20 h10 v20 h10 v-44 h-10 v15 h-10 v-15 h-10" 
        fill="none" stroke="#333" stroke-width="3" filter="url(#textShadow)" />
  
  <!-- Filled Text (appears after animation) -->
  <text x="170" y="85" font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif" font-weight="bold" font-size="48" fill="#e74c3c" filter="url(#textShadow)" opacity="0.9">
    <tspan fill="#e74c3c">Blood</tspan>
    <tspan fill="#333">Bank</tspan>
  </text>
  
  <!-- Modern Tagline -->
  <text x="170" y="115" font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif" font-size="16" fill="#666" filter="url(#textShadow)">
    Saving Lives Together
  </text>
  
  <!-- Heartbeat Line -->
  <path class="text-animate" d="M170 130 h20 l5 -10 l5 10 l5 -10 l5 10 h20" 
        fill="none" stroke="#e74c3c" stroke-width="1.5" stroke-linecap="round" />
</svg>